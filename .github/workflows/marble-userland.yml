name: marble-userland

on:
  workflow_dispatch:
  push:
    branches: [marble]
    paths:
      - "devices/marble/build-userland.sh"
      - "userland/**"
      - "sysimage/**"

permissions:
  contents: read

concurrency:
  group: marble-userland-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /usr/local/share/chromium /usr/local/share/edge /usr/share/az_* \
            /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 7zip build-essential python3
          sudo ln -sf /usr/bin/7zz /usr/local/bin/7z
          7z i | grep -i apfs

      - name: Fetch iOS 16.5 files and build wallpaper userland
        run: |
          ./sysimage/fetch.sh
          REST=1 PREBUILT=1 ./devices/marble/build-userland.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marble-userland
          if-no-files-found: warn
          retention-days: 14
          path: |
            userland/root.apfs
            userland/system.apfs
            sysimage/*.log
            userland/*.log
